<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Now - Todo App</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* App title */
        h1 {
            margin-top: 40px;
            font-size: 32px;
            color: #333;
            text-align: center;
        }

        /* Registration box */
        form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 350px;
            margin-top: 20px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        p {
            text-align: center;
            margin-top: 15px;
        }

        a {
            text-decoration: none;
            color: #007bff;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            color: red;
            margin-top: -15px;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>Todo App</h1>

    <form action="" method="post">
        {% csrf_token %}

        <label>Username:</label>
        <input type="text" name="username" required>
        {% if errors.username %}
            <p class="error">{{ errors.username }}</p>
        {% endif %}

        <label>Email:</label>
        <input type="email" name="email" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <label>Confirm Password:</label>
        <input type="password" name="confirm-password" required>
        {% if errors.confirm_password %}
            <p class="error">{{ errors.confirm_password }}</p>
        {% endif %}

        <button type="submit">Register</button>

        <p>Already have an account ? <a href="/login">LogIn</a></p>
    </form>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

</body>
</html>
